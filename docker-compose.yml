services:
  app:
    image: sipela-app:latest
    container_name: sipela-app
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./.composer:/composer
    environment:
      - COMPOSER_HOME=/composer
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sipela-network

  web:
    image: nginx:alpine
    container_name: sipela-web
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www/html
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sipela-network

  db:
    image: mysql:8.0
    container_name: sipela-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: sipela
      MYSQL_USER: sipela
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - sipela_mysql_data:/var/lib/mysql
    networks:
      - sipela-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sipela", "-psecret"]
      timeout: 5s
      retries: 20
      interval: 3s

volumes:
  sipela_mysql_data:

networks:
  sipela-network:
    driver: bridge
